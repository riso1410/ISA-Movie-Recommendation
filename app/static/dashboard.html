      function TabOperations({ onModelChanged, onOfflineChanged }) {
        const [taskId, setTaskId] = useState(null);
        const [taskState, setTaskState] = useState(null);
        const [weights, setWeights] = useState(null);
        const [gsResults, setGsResults] = useState(null);
        const [message, setMessage] = useState(null);
        const pollRef = useRef(null);

        // Load current weights on mount
        useEffect(() => {
          fetch("/api/model/weights")
            .then((r) => (r.ok ? r.json() : null))
            .then((d) => {
              if (d) setWeights(d.weights);
            })
            .catch(() => {});
        }, []);

        // Poll active task
        useEffect(() => {
          if (!taskId) return;
          const poll = () => {
            fetch(`/api/tasks/${taskId}`)
              .then((r) => (r.ok ? r.json() : null))
              .then((t) => {
                if (!t) return;
                setTaskState(t);
                if (t.status !== "running") {
                  clearInterval(pollRef.current);
                  pollRef.current = null;
                  setTaskId(null);
                  if (t.status === "completed") {
                    if (t.type === "retrain" || t.type === "apply_weights") {
                      onModelChanged();
                      // Reload weights
                      fetch("/api/model/weights")
                        .then((r) => (r.ok ? r.json() : null))
                        .then((d) => {
                          if (d) setWeights(d.weights);
                        });
                    }
                    if (t.type === "evaluate") onOfflineChanged();
                    if (
                      t.type === "gridsearch" &&
                      t.result &&
                      !t.result.cancelled
                    ) {
                      setGsResults(t.result);
                    }
                    setMessage({
                      type: "success",
                      text: `${t.type} completed`,
                    });
                  } else {
                    setMessage({
                      type: "error",
                      text: t.error || "Task failed",
                    });
                  }
                }
              });
          };
          pollRef.current = setInterval(poll, 1000);
          poll();
          return () => {
            if (pollRef.current) clearInterval(pollRef.current);
          };
        }, [taskId]);

        const busy = !!taskId;

        const startOp = async (endpoint, opts = {}) => {
          setMessage(null);
          try {
            const fetchOpts = { method: "POST", ...opts };
            const res = await fetch(endpoint, fetchOpts);
            if (!res.ok) {
              const err = await res
                .json()
                .catch(() => ({ detail: "Request failed" }));
              setMessage({
                type: "error",
                text: err.detail || "Request failed",
              });
              return;
            }
            const data = await res.json();
            if (data.task_id) {
              setTaskId(data.task_id);
              setTaskState({
                status: "running",
                progress: 0,
                progress_msg: "Starting...",
              });
            } else {
              setMessage({ type: "success", text: data.status || "Done" });
              if (endpoint.includes("reload-model")) onModelChanged();
              if (endpoint.includes("reload-data")) onModelChanged();
            }
          } catch (e) {
            setMessage({ type: "error", text: e.message });
          }
        };

        const handleCancel = async () => {
          if (!taskId) return;
          await fetch(`/api/tasks/${taskId}/cancel`, { method: "POST" });
        };

        const handleApplyWeights = () => {
          if (!weights) return;
          startOp("/api/operations/apply-weights", {
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ weights }),
          });
        };

        const handleApplyBest = () => {
          if (!gsResults || !gsResults.best_weights) return;
          setWeights({ ...gsResults.best_weights });
          startOp("/api/operations/apply-weights", {
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ weights: gsResults.best_weights }),
          });
        };

        const cancellable =
          taskState &&
          taskState.status === "running" &&
          (taskState.type === "gridsearch" ||
            taskState.type === "fetch_posters");

        return (
          <div>
            {/* Status message */}
            {message && (
              <div
                style={{
                  padding: "12px 16px",
                  borderRadius: 8,
                  marginBottom: 16,
                  background:
                    message.type === "error"
                      ? "rgba(255,107,107,0.15)"
                      : "rgba(81,207,102,0.15)",
                  border: `1px solid ${message.type === "error" ? "rgba(255,107,107,0.3)" : "rgba(81,207,102,0.3)"}`,
                  color: message.type === "error" ? "#ff6b6b" : "#51cf66",
                  fontSize: 13,
                }}
              >
                {message.text}
              </div>
            )}

            {/* Active task progress */}
            {taskState && taskState.status === "running" && (
              <div className="ops-progress-wrap">
                <div className="ops-progress-header">
                  <span style={{ fontSize: 14, fontWeight: 600 }}>
                    {taskState.type || "Task"} running...
                  </span>
                  <div
                    style={{ display: "flex", gap: 8, alignItems: "center" }}
                  >
                    <span className="ops-status running">
                      {(taskState.progress * 100).toFixed(0)}%
                    </span>
                    {cancellable && (
                      <button
                        className="ops-btn danger"
                        style={{ width: "auto", padding: "6px 14px" }}
                        onClick={handleCancel}
                      >
                        Cancel
                      </button>
                    )}
                  </div>
                </div>
                <div className="ops-progress-bar-bg">
                  <div
                    className="ops-progress-bar"
                    style={{ width: `${taskState.progress * 100}%` }}
                  />
                </div>
                <div className="ops-progress-msg">{taskState.progress_msg}</div>
              </div>
            )}

            {/* Heavy operations */}
            <div className="section-title">Heavy Operations</div>
            <div className="ops-grid">
              <div className="ops-card">
                <div className="ops-card-title">Retrain Model</div>
                <div className="ops-card-desc">
                  Full pipeline: load raw data, build features, fit recommender,
                  save pickle.
                </div>
                <button
                  className="ops-btn"
                  disabled={busy}
                  onClick={() => startOp("/api/operations/retrain")}
                >
                  Start Retrain
                </button>
              </div>
              <div className="ops-card">
                <div className="ops-card-title">Evaluate Metrics</div>
                <div className="ops-card-desc">
                  Run Precision@K, NDCG, Coverage, Diversity, Novelty on 100
                  test movies.
                </div>
                <button
                  className="ops-btn"
                  disabled={busy}
                  onClick={() => startOp("/api/operations/evaluate")}
                >
                  Run Evaluation
                </button>
              </div>
              <div className="ops-card">
                <div className="ops-card-title">Grid Search</div>
                <div className="ops-card-desc">
                  256 weight combinations over genres, keywords, director,
                  collection.
                </div>
                <button
                  className="ops-btn"
                  disabled={busy}
                  onClick={() => startOp("/api/operations/gridsearch")}
                >
                  Start Grid Search
                </button>
              </div>
              <div className="ops-card">
                <div className="ops-card-title">Fetch Posters</div>
                <div className="ops-card-desc">
                  Scrape TMDB poster URLs for movies missing posters. Slow,
                  cancellable.
                </div>
                <button
                  className="ops-btn"
                  disabled={busy}
                  onClick={() => startOp("/api/operations/fetch-posters")}
                >
                  Start Fetch
                </button>
              </div>
            </div>

            {/* Quick operations */}
            <div className="section-title">Quick Operations</div>
            <div className="ops-grid" style={{ marginBottom: 24 }}>
              <div className="ops-card">
                <div className="ops-card-title">Reload Model</div>
                <div className="ops-card-desc">
                  Re-read recommender.pkl from disk and hot-swap.
                </div>
                <button
                  className="ops-btn secondary"
                  disabled={busy}
                  onClick={() => startOp("/api/operations/reload-model")}
                >
                  Reload
                </button>
              </div>
              <div className="ops-card">
                <div className="ops-card-title">Reload Data</div>
                <div className="ops-card-desc">
                  Re-read movies_processed.csv and update poster URLs.
                </div>
                <button
                  className="ops-btn secondary"
                  disabled={busy}
                  onClick={() => startOp("/api/operations/reload-data")}
                >
                  Reload
                </button>
              </div>
            </div>

            {/* Weight editor */}
            {weights && (
              <React.Fragment>
                <div className="section-title">Field Weights</div>
                <div className="weight-editor">
                  {Object.entries(weights).map(([field, val]) => (
                    <div className="weight-row" key={field}>
                      <span className="weight-label">{field}</span>
                      <input
                        type="range"
                        className="weight-slider"
                        min="0"
                        max="3"
                        step="0.1"
                        value={val}
                        onChange={(e) =>
                          setWeights((w) => ({
                            ...w,
                            [field]: parseFloat(e.target.value),
                          }))
                        }
                      />
                      <span className="weight-val">{val.toFixed(1)}</span>
                    </div>
                  ))}
                  <button
                    className="ops-btn"
                    disabled={busy}
                    onClick={handleApplyWeights}
                    style={{ marginTop: 12 }}
                  >
                    Apply Weights &amp; Retrain
                  </button>
                </div>
              </React.Fragment>
            )}

            {/* Grid search results */}
            {gsResults && (
              <React.Fragment>
                <div className="section-title">Grid Search Results</div>
                <div className="glass-card" style={{ marginBottom: 24 }}>
                  <div
                    style={{
                      display: "flex",
                      justifyContent: "space-between",
                      alignItems: "center",
                      marginBottom: 12,
                    }}
                  >
                    <span style={{ fontSize: 14 }}>
                      Best:{" "}
                      <strong style={{ color: "#51cf66" }}>
                        {gsResults.best_score.toFixed(4)}
                      </strong>{" "}
                      ({gsResults.total_combos} combos)
                    </span>
                    <button
                      className="ops-btn"
                      style={{ width: "auto", padding: "8px 16px" }}
                      disabled={busy}
                      onClick={handleApplyBest}
                    >
                      Apply Best Weights
                    </button>
                  </div>
                  <table className="gs-results-table">
                    <thead>
                      <tr>
                        <th>#</th>
                        {gsResults.top_10[0] &&
                          Object.keys(gsResults.top_10[0].weights).map((f) => (
                            <th key={f}>{f}</th>
                          ))}
                        <th>P@K</th>
                        <th>NDCG</th>
                        <th>Combined</th>
                      </tr>
                    </thead>
                    <tbody>
                      {gsResults.top_10.map((row, idx) => (
                        <tr key={idx} className={idx === 0 ? "gs-best" : ""}>
                          <td>{idx + 1}</td>
                          {Object.values(row.weights).map((v, j) => (
                            <td key={j}>{v.toFixed(1)}</td>
                          ))}
                          <td>{(row.precision_at_k * 100).toFixed(1)}%</td>
                          <td>{row.ndcg_at_k.toFixed(4)}</td>
                          <td>{row.combined.toFixed(4)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </React.Fragment>
            )}
          </div>
        );
      }

      // ---------------------------------------------------------------------------
      // Main App
      // ---------------------------------------------------------------------------
      const TABS = [
        { id: "session", label: "Session" },
        { id: "modelvr", label: "Model vs Random" },
        { id: "genre", label: "Genres" },
        { id: "scores", label: "Scores" },
        { id: "model", label: "Model Training" },
        { id: "offline", label: "Offline Metrics" },
        { id: "operations", label: "Operations" },
      ];

      function App() {
        const [activeTab, setActiveTab] = useState("session");
        const [analytics, setAnalytics] = useState(null);
        const [catalogStats, setCatalogStats] = useState(null);
        const [modelStats, setModelStats] = useState(null);
        const [offlineMetrics, setOfflineMetrics] = useState(null);
        const [loadingModel, setLoadingModel] = useState(false);
        const [loadingOffline, setLoadingOffline] = useState(false);

        const fetchAnalytics = useCallback(async () => {
          try {
            const res = await fetch("/api/analytics");
            if (!res.ok) return;
            const data = await res.json();
            setAnalytics(data);
          } catch (e) {
            console.error("analytics fetch failed:", e);
          }
        }, []);

        // Poll analytics every 5s
        useEffect(() => {
          fetchAnalytics();
          const id = setInterval(fetchAnalytics, 5000);
          return () => clearInterval(id);
        }, [fetchAnalytics]);

        const fetchModelStats = useCallback(async () => {
          if (modelStats || loadingModel) return;
          setLoadingModel(true);
          try {
            const res = await fetch("/api/analytics/model");
            if (res.ok) setModelStats(await res.json());
          } catch (e) {
            console.error("model stats fetch failed:", e);
          }
          setLoadingModel(false);
        }, [modelStats, loadingModel]);

        const fetchOfflineMetrics = useCallback(async () => {
          if (offlineMetrics || loadingOffline) return;
          setLoadingOffline(true);
          try {
            const res = await fetch("/api/analytics/offline");
            if (res.ok) setOfflineMetrics(await res.json());
          } catch (e) {
            console.error("offline metrics fetch failed:", e);
          }
          setLoadingOffline(false);
        }, [offlineMetrics, loadingOffline]);

        // Load model stats eagerly when tab opens
        useEffect(() => {
          if (activeTab === "model") fetchModelStats();
          if (activeTab === "offline") fetchOfflineMetrics();
        }, [activeTab]);

        const invalidateModel = useCallback(() => setModelStats(null), []);
        const invalidateOffline = useCallback(
          () => setOfflineMetrics(null),
          [],
        );

        const handleExport = () => {
          if (!analytics) return;
          const payload = {
            exported_at: new Date().toISOString(),
            total_swipes: analytics.total_swipes,
            like_rates: analytics.like_rates,
            confusion: analytics.confusion,
            swipe_log: analytics.swipe_log,
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], {
            type: "application/json",
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `moviematch-session-${Date.now()}.json`;
          a.click();
          URL.revokeObjectURL(url);
        };

        const renderTab = () => {
          switch (activeTab) {
            case "session":
              return <TabSession analytics={analytics} />;
            case "modelvr":
              return <TabModelVsRandom analytics={analytics} />;
            case "genre":
              return <TabGenrePopularity analytics={analytics} />;
            case "scores":
              return <TabScoreAnalysis analytics={analytics} />;
            case "model":
              return (
                <TabModelTraining
                  modelStats={modelStats}
                  loadingModel={loadingModel}
                  fetchModelStats={fetchModelStats}
                />
              );
            case "offline":
              return (
                <TabOfflineMetrics
                  offlineMetrics={offlineMetrics}
                  loadingOffline={loadingOffline}
                  fetchOfflineMetrics={fetchOfflineMetrics}
                />
              );
            case "operations":
              return (
                <TabOperations
                  onModelChanged={invalidateModel}
                  onOfflineChanged={invalidateOffline}
                />
              );
            default:
              return null;
          }
        };

        return (
          <div className="app-container">
            <header className="header">
              <div className="logo">MovieMatch Analytics</div>
              <div className="header-actions">
                <span
                  style={{
                    fontSize: 12,
                    color: "rgba(255,255,255,0.4)",
                    display: "flex",
                    alignItems: "center",
                  }}
                >
                  <span className="poll-dot"></span>
                  live
                </span>
                <a className="nav-link" href="/">
                  Back to Swiper
                </a>
                <button className="nav-link export-btn" onClick={handleExport}>
                  Export JSON
                </button>
              </div>
            </header>

            <nav className="tab-bar">
              {TABS.map((t) => (
                <button
                  key={t.id}
                  className={`tab-btn${activeTab === t.id ? " active" : ""}`}
                  onClick={() => setActiveTab(t.id)}
                >
                  {t.label}
                </button>
              ))}
            </nav>

            <main>{renderTab()}</main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
