<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieMatch - Swipe to Discover Movies</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        min-height: 100vh;
        color: #fff;
        overflow-x: hidden;
      }

      .app-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      /* Header */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 0;
        margin-bottom: 20px;
      }
      .logo {
        font-size: 28px;
        font-weight: 700;
        background: linear-gradient(135deg, #ff6b6b, #ee5a24);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .stats {
        display: flex;
        gap: 20px;
        font-size: 14px;
      }
      .stat-item {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .stat-liked {
        color: #51cf66;
      }
      .stat-disliked {
        color: #ff6b6b;
      }
      .reset-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        transition: all 0.3s;
      }
      .reset-btn:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .source-badge {
        position: absolute;
        top: 12px;
        right: 12px;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        z-index: 5;
        backdrop-filter: blur(4px);
      }
      .source-badge.model {
        background: rgba(81, 207, 102, 0.25);
        color: #51cf66;
        border: 1px solid rgba(81, 207, 102, 0.4);
      }
      .source-badge.random {
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .nav-link {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        text-decoration: none;
        transition: all 0.3s;
      }
      .nav-link:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* Main layout */
      .main-content {
        display: flex;
        gap: 30px;
        align-items: flex-start;
      }

      /* Swipe area */
      .swipe-area {
        flex: 0 0 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Movie card */
      .card-container {
        width: 360px;
        height: 540px;
        position: relative;
        perspective: 1000px;
        margin-bottom: 20px;
      }
      .movie-card {
        width: 100%;
        height: 100%;
        border-radius: 20px;
        overflow: hidden;
        position: relative;
        cursor: grab;
        user-select: none;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        transition: transform 0.1s ease;
        background: #1a1a2e;
      }
      .movie-card:active {
        cursor: grabbing;
      }
      .movie-card.swiping-right {
        box-shadow: 0 10px 40px rgba(81, 207, 102, 0.3);
      }
      .movie-card.swiping-left {
        box-shadow: 0 10px 40px rgba(255, 107, 107, 0.3);
      }

      .card-poster {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card-no-poster {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1a1a2e, #16213e);
        font-size: 48px;
      }
      .card-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 20px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
      }
      .card-title {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 8px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      }
      .card-genres {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }
      .genre-badge {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(4px);
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
      }
      .card-rating {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
      }
      .rating-star {
        color: #ffd43b;
      }
      .card-overview {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
        margin-top: 8px;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* Swipe overlays */
      .swipe-overlay {
        position: absolute;
        top: 50%;
        transform: translateY(-50%) rotate(-15deg);
        font-size: 42px;
        font-weight: 700;
        padding: 10px 25px;
        border-radius: 10px;
        border: 4px solid;
        opacity: 0;
        transition: opacity 0.1s;
        z-index: 10;
      }
      .swipe-like {
        left: 20px;
        color: #51cf66;
        border-color: #51cf66;
      }
      .swipe-nope {
        right: 20px;
        color: #ff6b6b;
        border-color: #ff6b6b;
        transform: translateY(-50%) rotate(15deg);
      }

      /* Action buttons */
      .action-buttons {
        display: flex;
        gap: 30px;
        justify-content: center;
      }
      .action-btn {
        width: 65px;
        height: 65px;
        border-radius: 50%;
        border: 2px solid;
        background: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        transition: all 0.3s;
      }
      .btn-dislike {
        border-color: #ff6b6b;
        color: #ff6b6b;
      }
      .btn-dislike:hover {
        background: #ff6b6b;
        color: #fff;
        transform: scale(1.15);
      }
      .btn-like {
        border-color: #51cf66;
        color: #51cf66;
      }
      .btn-like:hover {
        background: #51cf66;
        color: #fff;
        transform: scale(1.15);
      }

      /* Recommendations panel */
      .recommendations {
        flex: 1;
        min-width: 300px;
      }
      .rec-header {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .rec-subtitle {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.5);
        margin-bottom: 20px;
      }
      .rec-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 15px;
      }
      .rec-card {
        border-radius: 12px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.05);
        transition:
          transform 0.3s,
          box-shadow 0.3s;
        cursor: default;
      }
      .rec-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      }
      .rec-poster {
        width: 100%;
        aspect-ratio: 2/3;
        object-fit: cover;
      }
      .rec-no-poster {
        width: 100%;
        aspect-ratio: 2/3;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a1a2e;
        font-size: 24px;
      }
      .rec-info {
        padding: 10px;
      }
      .rec-title {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rec-rating {
        font-size: 12px;
        color: #ffd43b;
      }

      /* Rec card overlay */
      .rec-card {
        position: relative;
      }
      .rec-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        opacity: 0;
        transition: opacity 0.2s;
        border-radius: 12px;
        z-index: 5;
      }
      .rec-card:hover .rec-overlay {
        opacity: 1;
      }
      .rec-overlay-btn {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        border: 2px solid;
        background: rgba(0, 0, 0, 0.4);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        transition: all 0.2s;
      }
      .rec-overlay-btn.like {
        border-color: #51cf66;
        color: #51cf66;
      }
      .rec-overlay-btn.like:hover {
        background: #51cf66;
        color: #fff;
        transform: scale(1.15);
      }
      .rec-overlay-btn.dislike {
        border-color: #ff6b6b;
        color: #ff6b6b;
      }
      .rec-overlay-btn.dislike:hover {
        background: #ff6b6b;
        color: #fff;
        transform: scale(1.15);
      }

      /* Rec card flash animations */
      .rec-card.flash-like {
        animation: recFlashLike 0.4s ease forwards;
      }
      .rec-card.flash-dislike {
        animation: recFlashDislike 0.4s ease forwards;
      }
      @keyframes recFlashLike {
        0% {
          box-shadow: 0 0 0 0 rgba(81, 207, 102, 0.6);
          transform: scale(1);
          opacity: 1;
        }
        40% {
          box-shadow: 0 0 20px 4px rgba(81, 207, 102, 0.4);
          transform: scale(0.95);
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
          transform: scale(0.8);
          opacity: 0;
        }
      }
      @keyframes recFlashDislike {
        0% {
          box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.6);
          transform: scale(1);
          opacity: 1;
        }
        40% {
          box-shadow: 0 0 20px 4px rgba(255, 107, 107, 0.4);
          transform: scale(0.95);
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
          transform: scale(0.8);
          opacity: 0;
        }
      }

      /* Loading state */
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 540px;
        font-size: 18px;
        color: rgba(255, 255, 255, 0.5);
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #ff6b6b;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 12px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .no-recs {
        text-align: center;
        padding: 40px 20px;
        color: rgba(255, 255, 255, 0.4);
      }
      .no-recs-icon {
        font-size: 48px;
        margin-bottom: 10px;
      }
      .no-recs-text {
        font-size: 14px;
      }

      /* Card exit animations */
      .card-exit-right {
        animation: exitRight 0.4s ease forwards;
      }
      .card-exit-left {
        animation: exitLeft 0.4s ease forwards;
      }
      @keyframes exitRight {
        to {
          transform: translateX(150%) rotate(30deg);
          opacity: 0;
        }
      }
      @keyframes exitLeft {
        to {
          transform: translateX(-150%) rotate(-30deg);
          opacity: 0;
        }
      }
      .card-enter {
        animation: cardEnter 0.3s ease;
      }
      @keyframes cardEnter {
        from {
          transform: scale(0.9);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* Responsive */
      @media (max-width: 900px) {
        .main-content {
          flex-direction: column;
          align-items: center;
        }
        .swipe-area {
          flex: none;
        }
        .recommendations {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback } = React;

      const API = ""; // Same origin

      function App() {
        const [movie, setMovie] = useState(null);
        const [loading, setLoading] = useState(true);
        const [recommendations, setRecommendations] = useState([]);
        const [stats, setStats] = useState({ liked: 0, disliked: 0 });
        const [exitDir, setExitDir] = useState(null);
        const [dragX, setDragX] = useState(0);
        const [feedbackId, setFeedbackId] = useState(null);
        const [feedbackDir, setFeedbackDir] = useState(null);
        const isDragging = useRef(false);
        const startX = useRef(0);
        const swiping = useRef(false);

        const fetchMovie = useCallback(async () => {
          setLoading(true);
          try {
            const res = await fetch(`${API}/api/movie`);
            const data = await res.json();
            if (data.error) {
              setMovie(null);
            } else {
              setMovie(data);
            }
          } catch (e) {
            console.error(e);
          }
          setLoading(false);
        }, []);

        const fetchRecommendations = useCallback(async () => {
          try {
            const res = await fetch(`${API}/api/recommendations`);
            const data = await res.json();
            setRecommendations(data.recommendations || []);
          } catch (e) {
            console.error(e);
          }
        }, []);

        const fetchStats = useCallback(async () => {
          try {
            const res = await fetch(`${API}/api/stats`);
            const data = await res.json();
            setStats(data);
          } catch (e) {
            console.error(e);
          }
        }, []);

        useEffect(() => {
          fetchMovie();
          fetchRecommendations();
          fetchStats();
        }, []);

        const handleSwipe = useCallback(
          async (direction) => {
            if (!movie || swiping.current) return;
            swiping.current = true;

            setExitDir(direction);

            await fetch(`${API}/api/swipe`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ movie_id: movie.id, direction }),
            });

            setTimeout(async () => {
              setExitDir(null);
              setDragX(0);
              await fetchMovie();
              await fetchRecommendations();
              await fetchStats();
              swiping.current = false;
            }, 400);
          },
          [movie, fetchMovie, fetchRecommendations, fetchStats],
        );

        // Keyboard controls
        useEffect(() => {
          const handleKeyDown = (e) => {
            if (e.key === "ArrowLeft") handleSwipe("left");
            if (e.key === "ArrowRight") handleSwipe("right");
          };
          window.addEventListener("keydown", handleKeyDown);
          return () => window.removeEventListener("keydown", handleKeyDown);
        }, [handleSwipe]);

        // Mouse drag
        const onMouseDown = (e) => {
          isDragging.current = true;
          startX.current = e.clientX;
          setDragX(0);
        };
        const onMouseMove = (e) => {
          if (!isDragging.current) return;
          setDragX(e.clientX - startX.current);
        };
        const onMouseUp = () => {
          if (!isDragging.current) return;
          isDragging.current = false;
          if (dragX > 100) handleSwipe("right");
          else if (dragX < -100) handleSwipe("left");
          else setDragX(0);
        };

        const handleReset = async () => {
          await fetch(`${API}/api/reset`);
          setRecommendations([]);
          setStats({ liked: 0, disliked: 0 });
          fetchMovie();
        };

        const handleRecFeedback = useCallback(
          async (movieId, direction) => {
            setFeedbackId(movieId);
            setFeedbackDir(direction);

            try {
              const res = await fetch(`${API}/api/rec-feedback`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ movie_id: movieId, direction }),
              });
              const data = await res.json();

              setTimeout(() => {
                setFeedbackId(null);
                setFeedbackDir(null);
                setRecommendations(data.recommendations || []);
                fetchStats();
              }, 400);
            } catch (e) {
              console.error(e);
              setFeedbackId(null);
              setFeedbackDir(null);
            }
          },
          [fetchStats],
        );

        const likeOpacity = Math.min(Math.max(dragX / 100, 0), 1);
        const nopeOpacity = Math.min(Math.max(-dragX / 100, 0), 1);

        return (
          <div className="app-container">
            <header className="header">
              <div className="logo">MovieMatch</div>
              <div className="stats">
                <span className="stat-item stat-liked">
                  &#x2764; {stats.liked}
                </span>
                <span className="stat-item stat-disliked">
                  &#x2718; {stats.disliked}
                </span>
              </div>
              <div style={{ display: "flex", gap: "8px" }}>
                <a className="nav-link" href="/dashboard">
                  Analytics
                </a>
                <button className="reset-btn" onClick={handleReset}>
                  Reset
                </button>
              </div>
            </header>

            <div className="main-content">
              <div className="swipe-area">
                <div className="card-container">
                  {loading ? (
                    <div className="loading">
                      <div className="spinner"></div>
                      Loading...
                    </div>
                  ) : movie ? (
                    <div
                      className={`movie-card ${exitDir === "right" ? "card-exit-right" : ""} ${exitDir === "left" ? "card-exit-left" : ""} ${!exitDir ? "card-enter" : ""} ${dragX > 50 ? "swiping-right" : ""} ${dragX < -50 ? "swiping-left" : ""}`}
                      style={
                        !exitDir
                          ? {
                              transform: `translateX(${dragX}px) rotate(${dragX * 0.05}deg)`,
                            }
                          : {}
                      }
                      onMouseDown={onMouseDown}
                      onMouseMove={onMouseMove}
                      onMouseUp={onMouseUp}
                      onMouseLeave={onMouseUp}
                    >
                      <div
                        className="swipe-overlay swipe-like"
                        style={{ opacity: likeOpacity }}
                      >
                        LIKE
                      </div>
                      <div
                        className="swipe-overlay swipe-nope"
                        style={{ opacity: nopeOpacity }}
                      >
                        NOPE
                      </div>

                      {movie.source && (
                        <div
                          className={`source-badge ${movie.source === "model" ? "model" : "random"}`}
                        >
                          {movie.source === "model" ? "AI Pick" : "Exploring"}
                        </div>
                      )}

                      {movie.poster_url ? (
                        <img
                          className="card-poster"
                          src={movie.poster_url}
                          alt={movie.title}
                          onError={(e) => {
                            e.target.style.display = "none";
                            e.target.nextSibling.style.display = "flex";
                          }}
                        />
                      ) : null}
                      <div
                        className="card-no-poster"
                        style={movie.poster_url ? { display: "none" } : {}}
                      >
                        &#127909;
                      </div>

                      <div className="card-overlay">
                        <div className="card-title">{movie.title}</div>
                        <div className="card-genres">
                          {(movie.genres || []).slice(0, 4).map((g, i) => (
                            <span key={i} className="genre-badge">
                              {g}
                            </span>
                          ))}
                        </div>
                        <div className="card-rating">
                          <span className="rating-star">&#9733;</span>
                          {movie.vote_average?.toFixed(1)} ({movie.vote_count}{" "}
                          votes)
                        </div>
                        <div className="card-overview">{movie.overview}</div>
                      </div>
                    </div>
                  ) : (
                    <div className="loading">No more movies!</div>
                  )}
                </div>

                <div className="action-buttons">
                  <button
                    className="action-btn btn-dislike"
                    onClick={() => handleSwipe("left")}
                  >
                    &#x2718;
                  </button>
                  <button
                    className="action-btn btn-like"
                    onClick={() => handleSwipe("right")}
                  >
                    &#x2764;
                  </button>
                </div>
              </div>

              <div className="recommendations">
                <div className="rec-header">&#127775; Your Recommendations</div>
                {stats.liked >= 3 ? (
                  <div className="rec-subtitle">
                    Based on your {stats.liked} liked movies
                  </div>
                ) : (
                  <div className="rec-subtitle">
                    Like {3 - stats.liked} more movie
                    {3 - stats.liked !== 1 ? "s" : ""} to get personalized
                    recommendations
                  </div>
                )}

                {recommendations.length > 0 ? (
                  <div className="rec-grid">
                    {recommendations.map((rec, i) => (
                      <div
                        key={rec.id || i}
                        className={`rec-card${feedbackId === rec.id && feedbackDir === "right" ? " flash-like" : ""}${feedbackId === rec.id && feedbackDir === "left" ? " flash-dislike" : ""}`}
                      >
                        {rec.poster_url ? (
                          <img
                            className="rec-poster"
                            src={rec.poster_url}
                            alt={rec.title}
                            onError={(e) => {
                              e.target.style.display = "none";
                              e.target.nextSibling.style.display = "flex";
                            }}
                          />
                        ) : null}
                        <div
                          className="rec-no-poster"
                          style={rec.poster_url ? { display: "none" } : {}}
                        >
                          &#127909;
                        </div>
                        <div className="rec-overlay">
                          <button
                            className="rec-overlay-btn dislike"
                            onClick={() => handleRecFeedback(rec.id, "left")}
                            title="Dislike"
                          >
                            &#x2718;
                          </button>
                          <button
                            className="rec-overlay-btn like"
                            onClick={() => handleRecFeedback(rec.id, "right")}
                            title="Like"
                          >
                            &#x2764;
                          </button>
                        </div>
                        <div className="rec-info">
                          <div className="rec-title">{rec.title}</div>
                          <div className="rec-rating">
                            &#9733; {rec.vote_average?.toFixed(1)}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="no-recs">
                    <div className="no-recs-icon">&#128253;</div>
                    <div className="no-recs-text">
                      {stats.liked >= 3
                        ? "Computing recommendations..."
                        : "Swipe right on movies you like!"}
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
