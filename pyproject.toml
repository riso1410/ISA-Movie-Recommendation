[project]
name = "isa-movie-recommendation"
version = "0.1.0"
description = "Content-based movie recommender system for ISA course"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "wordcloud>=1.9",
    "jupyter>=1.0",
    "notebook>=7.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-dotenv>=0.5.1",
    "click",
]

[dependency-groups]
dev = []
