[project]
name = "isa-movie-recommendation"
version = "0.1.0"
description = "Content-based movie recommender system for ISA course"
requires-python = ">=3.12"
dependencies = [
    # data processing
    "pandas>=2.0",
    "numpy>=1.24",
    # machine learning
    "scikit-learn>=1.3",
    # visualization
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "wordcloud>=1.9",
    # notebook
    "jupyter>=1.0",
    "notebook>=7.0",
    # web app
    "fastapi>=0.100",
    "uvicorn>=0.23",
    # utilities
    "python-dotenv>=0.5.1",
    "click",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
